name = "Yukino"
grammar = "yukino"
path_suffixes = ["ykn"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 4
hard_tabs = false
decrease_indent_pattern = "^\\s*([\\}\\]\\)]|(else|elif|catch|finally)\\b)"

brackets = [
    { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "[", end = "]", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "${", end = "}", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] }
]
