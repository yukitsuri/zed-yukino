name = "Yukino"
grammar = "yukino"
path_suffixes = ["ykn"]
line_comments = ["// ", "//", "/// "]
block_comment = ["/*", "*/"]
word_characters = ["_"]
tab_size = 4
hard_tabs = false

autoclose_before = " ;,:=)>]} \n\t"

[[brackets]]
start = "{"
end = "}"
close = true
newline = true

[[brackets]]
start = "["
end = "]"
close = true
newline = true

[[brackets]]
start = "("
end = ")"
close = true
newline = true

[[brackets]]
start = "\""
end = "\""
close = true
newline = false

[[brackets]]
start = "'"
end = "'"
close = true
newline = false

[[brackets]]
start = "${"
end = "}"
close = true
newline = false

[[brackets]]
start = "<"
end = ">"
close = true
newline = false

[[brackets]]
start = "|"
end = "|"
close = true
newline = false

[indent]
tab_size = 4
unit = "    "

[language_servers]
yukino-lsp = {}
